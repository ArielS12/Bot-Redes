# Blueprint Render: web + Postgres persistente (los datos sobreviven redeploys/restarts).
# Region frankfurt (UE): necesario para API Binance testnet (Oregon/USA devuelve HTTP 451).
# Despliegue: Render Dashboard -> New + -> Blueprint -> conectar repo.
# Nota: la region no se puede cambiar en recursos ya creados; hay que recrearlos si venian de oregon.

databases:
  - name: tradingbots-db
    plan: free
    databaseName: tradingbots
    region: frankfurt

services:
  - type: web
    name: tradingbots-platform-poc
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./src/TradingBots.App/Dockerfile
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:5001
      - key: PORT
        value: 5001
      # Evita crash al arrancar por limite inotify en instancias free de Render.
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: DB_PROVIDER
        value: Postgres
      - key: Database__Provider
        value: Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: tradingbots-db
          property: connectionString
      - key: Jwt__Issuer
        value: TradingBots.App
      - key: Jwt__Audience
        value: TradingBots.Client
      - key: Jwt__SecretKey
        generateValue: true
      - key: Jwt__ExpirationMinutes
        value: 120
      - key: AdminUser__Username
        value: admin
      - key: AdminUser__Password
        generateValue: true
